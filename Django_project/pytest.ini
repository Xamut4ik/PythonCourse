[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
django_find_project = false
pythonpath = .
testpaths = tests
python_files = test_*.py
# importlib: у батьківських папках є __init__.py, і стандартний режим імпортував би тести
# як my_hillel_project.Django_project.tests..., чого Django не розуміє
addopts = --import-mode=importlib --strict-markers
asyncio_default_fixture_loop_scope = function
markers =
    unit: ізольовані тести моделей, форм, views, кошика
    integration: повні користувацькі сценарії
