<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Книжковий магазин{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'books:list' %}">
            📚 Книжковий магазин
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'books:list' %}">
                Книги
            </a>

            {% if user.is_authenticated %}
                {% if perms.books.add_book %}
                    <a class="nav-link" href="{% url 'books:create' %}">
                        Додати книгу
                    </a>
                {% endif %}
            {% endif %}
        </div>

        <div class="ms-auto">

            {% if user.is_authenticated %}

                <span class="text-light me-3">
                    Ви увійшли як {{ user.username }}
                </span>

                <form action="{% url 'books:logout' %}"
                      method="POST"
                      class="d-inline">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-outline-light">
                        Вийти
                    </button>
                </form>

            {% else %}

                <a href="{% url 'books:login' %}"
                   class="btn btn-outline-light me-2">
                    Увійти
                </a>

                <a href="{% url 'books:register' %}"
                   class="btn btn-light">
                    Реєстрація
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<main class="container mt-4">

    {% block content %}
    {% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
