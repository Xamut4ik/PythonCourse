{% extends 'books/base.html' %}

{% block title %}
    Редагувати книгу
{% endblock %}

{% block content %}

<h1 class="mb-4">Редагувати книгу</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Зберегти зміни
    </button>

    <a href="{% url 'books:detail' book.pk %}"
       class="btn btn-secondary">
        Скасувати
    </a>

</form>


{% if perms.books.delete_book %}

<hr class="my-4">

<form action="{% url 'books:delete' book.pk %}"
      method="POST"
      onsubmit="return confirm('Ви впевнені, що хочете видалити цю книгу?');">

    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Видалити книгу
    </button>

</form>

{% endif %}

{% endblock %}
