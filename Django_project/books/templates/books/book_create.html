{% extends 'books/base.html' %}

{% block title %}
    Додати книгу
{% endblock %}

{% block content %}

<h1 class="mb-4">Додати книгу</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Додати книгу
    </button>

    <a href="{% url 'books:list' %}"
       class="btn btn-secondary">
        Скасувати
    </a>

</form>

{% endblock %}
