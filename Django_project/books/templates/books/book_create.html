{% extends 'books/base.html' %}
{% load i18n %}

{% block title %}
    {% translate "Add book" %}
{% endblock %}

{% block content %}

<h1 class="mb-4">{% translate "Add book" %}</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        {% translate "Add book" %}
    </button>

    <a href="{% url 'books:list' %}"
       class="btn btn-secondary">
        {% translate "Cancel" %}
    </a>

</form>

{% endblock %}
