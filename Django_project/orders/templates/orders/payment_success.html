{% extends 'books/base.html' %}

{% block title %}
    Оплата успішна
{% endblock %}

{% block content %}

<h1>Дякуємо за покупку!</h1>

<div class="card mt-4">
    <div class="card-body">
        <p>
            {{ order }} — <strong>{{ order.get_status_display }}</strong>
        </p>
        <p>
            Сума: {{ order.get_total_cost }} грн
        </p>
        <p>
            Деталі замовлення надіслано на {{ order.email }}.
        </p>

        <a href="{% url 'books:list' %}" class="btn btn-primary">
            До каталогу
        </a>
    </div>
</div>

{% endblock %}
